<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle glow aura -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Icon Graphic: Audio Wave & Musical Note Symbol -->
  <g transform="translate(106, 106)">
    <!-- Outer accent circle -->
    <circle cx="150" cy="150" r="130" fill="#0f172a" stroke="#334155" stroke-width="6"/>

    <!-- Sound waves bars -->
    <rect x="55" y="130" width="12" height="40" rx="6" fill="url(#cyan-glow)"/>
    <rect x="75" y="105" width="12" height="90" rx="6" fill="url(#cyan-glow)"/>
    <rect x="95" y="80" width="12" height="140" rx="6" fill="url(#cyan-glow)"/>

    <!-- Main Music Note -->
    <path d="M190 70 L250 55 L250 170 A36 36 0 1 1 214 138 L214 100 L160 114 L160 190 A36 36 0 1 1 124 158 L124 70 Z" fill="url(#cyan-glow)" filter="url(#glow)"/>
    <path d="M190 70 L250 55 L250 78 L190 92 Z" fill="url(#pink-glow)"/>
  </g>

  <!-- Small PlayVear branding tag -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="4">PLAYVEAR</text>
</svg>
